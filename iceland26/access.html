<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a2b">
  <meta name="robots" content="noindex, nofollow">
  <title>Enter the Iceland 2026 board</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/iceland26/access.css?v=20260726">
  <script type="module" src="/iceland26/access.js?v=20260726"></script>
</head>
<body>
  <main>
    <section class="access-card" aria-labelledby="access-title">
      <div class="landscape" aria-hidden="true">
        <span class="sun"></span>
        <span class="ridge ridge--far"></span>
        <span class="ridge ridge--near"></span>
        <span class="road"></span>
      </div>
      <div class="access-copy">
        <p class="kicker">IS / 26 · private route room</p>
        <h1 id="access-title">The road is<br><em>just ahead.</em></h1>
        <p>This shared map, dated route and decision board is for the Iceland group. Enter the trip code to continue.</p>
        <form id="access-form">
          <label for="trip-code">Shared trip code</label>
          <div class="code-row">
            <input id="trip-code" name="code" type="password" required maxlength="256" autocomplete="current-password" spellcheck="false">
            <button type="submit">Enter <span aria-hidden="true">→</span></button>
          </div>
          <p class="message" id="access-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer><span>carboncaste.io</span><span>no public indexing · shared group access</span></footer>
</body>
</html>
